# GlimmerWorks 配置
# 本文件是自描述的设置注册表：[[tags]] 定义分组，[[settings]] 定义设置项。
# displayName 为本地化字符串 Key（见程序本地化体系），UI 通过 TranslateString 自动翻译。
version = 1

[[tags]]
displayName = "settings_tag_general"
tag_id = "general"
enable = true
visible = true

[[tags]]
displayName = "settings_tag_window"
tag_id = "window"
enable = true
visible = true

[[tags]]
displayName = "settings_tag_audio"
tag_id = "audio"
enable = true
visible = true

[[tags]]
displayName = "settings_tag_world"
tag_id = "world"
enable = true
visible = true

[[tags]]
displayName = "settings_tag_mods"
tag_id = "mods"
enable = true
visible = true

[[tags]]
displayName = "settings_tag_console"
tag_id = "console"
enable = true
visible = true

[[tags]]
displayName = "settings_tag_advanced"
tag_id = "advanced"
enable = false
visible = false

# ==== 通用 ====
[[settings]]
displayName = "settings_runtime_path"
key = "runtime_path"
group_tag = "general"
required_tags = ["advanced"]
type = "string"
default_value = "runtime"
value = "runtime"

[[settings]]
displayName = "settings_cache_path"
key = "cache_path"
group_tag = "general"
required_tags = ["advanced"]
type = "string"
default_value = "runtime/.cache"
value = "runtime/.cache"

[[settings]]
displayName = "settings_log_path"
key = "log_path"
group_tag = "general"
required_tags = ["advanced"]
type = "string"
default_value = "runtime/.logs"
value = "runtime/.logs"

[[settings]]
displayName = "settings_main_menu_target_fps"
key = "main_menu_target_fps"
group_tag = "general"
required_tags = ["advanced"]
type = "float"
default_value = 15.0
value = 15.0

