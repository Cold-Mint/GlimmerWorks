config_version = 1

# UI language code (e.g. "zh_CN", "en_US"). Leave empty to follow the system.
# 界面语言代码（如 "zh_CN"、"en_US"）。留空则跟随系统。
language = ""

[window]
# Window width (pixels)
# 窗口宽度（像素）
width = 1920
# Window height (pixels)
# 窗口高度（像素）
height = 1080
# Is it full screen
# 是否全屏
fullscreen = false
# Enable vertical sync (VSync)
# 启用垂直同步
vsync = true
